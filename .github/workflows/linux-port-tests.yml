name: Linux port tests

on:
  push:
    branches: [linux-port]
  pull_request:
    branches: [linux-port]

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Linux port foundation
        run: bash scripts/check-linux-foundation.sh
