name: Linux port tests

on:
  push:
    branches: [linux-port]
  pull_request:
    branches: [linux-port]

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run compatibility unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile compatibility module
        run: python -m py_compile dtw_platform.py
