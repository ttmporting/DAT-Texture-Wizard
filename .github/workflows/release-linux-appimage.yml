name: Publish Linux AppImages

on:
  push:
    tags:
      - "linux-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} AppImage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Run Linux port tests
        run: bash scripts/check-linux-foundation.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/build-appimage.sh

      - name: Smoke-test bundled Python and Tcl/Tk
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -maxdepth 1 -type f -name 'DATTextureWizard-*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          case "$APPIMAGE" in
            *-"${{ matrix.arch }}".AppImage) ;;
            *) echo "Unexpected AppImage architecture: $APPIMAGE" >&2; exit 1 ;;
          esac
          xvfb-run -a "$APPIMAGE" --appimage-smoke-test
          file "$APPIMAGE"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: DATTextureWizard-Release-${{ matrix.arch }}
          path: dist/DATTextureWizard-*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download architecture builds
        uses: actions/download-artifact@v4
        with:
          pattern: DATTextureWizard-Release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum DATTextureWizard-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release with AppImages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/DATTextureWizard-*.AppImage \
            dist/SHA256SUMS \
            --title "DAT Texture Wizard ${GITHUB_REF_NAME#linux-}" \
            --generate-notes
