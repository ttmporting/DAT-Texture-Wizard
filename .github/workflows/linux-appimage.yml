name: Linux AppImage

on:
  push:
    branches:
      - linux-port
  pull_request:
    branches:
      - linux-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64-appimage:
    name: Build and smoke-test x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out linux-port
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Run Linux port tests
        run: bash scripts/check-linux-foundation.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/build-appimage.sh

      - name: Smoke-test bundled Python and Tcl/Tk
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -maxdepth 1 -type f -name 'DATTextureWizard-*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          xvfb-run -a "$APPIMAGE" --appimage-smoke-test
          file "$APPIMAGE"
          sha256sum "$APPIMAGE"

      - name: Upload AppImage build
        uses: actions/upload-artifact@v4
        with:
          name: DATTextureWizard-AppImage-x86_64
          path: dist/DATTextureWizard-*.AppImage
          if-no-files-found: error
          retention-days: 14

  test-mainstream-distros:
    name: Smoke-test on ${{ matrix.distro }}
    needs: build-x86_64-appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth
          - distro: Debian 12
            image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth
          - distro: Debian 13
            image: debian:13
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth
          - distro: Fedora 43
            image: fedora:43
            install: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth
          - distro: Fedora 44
            image: fedora:44
            install: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth
          - distro: Arch Linux
            image: archlinux:latest
            install: pacman -Sy --noconfirm --needed xorg-server-xvfb xorg-xauth
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: DATTextureWizard-AppImage-x86_64
          path: dist

      - name: Install virtual display
        run: ${{ matrix.install }}

      - name: Smoke-test GUI and bundled Tcl/Tk
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -maxdepth 1 -type f -name 'DATTextureWizard-*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          ldd --version | head -n 1
          xvfb-run -a "$APPIMAGE" --appimage-smoke-test
